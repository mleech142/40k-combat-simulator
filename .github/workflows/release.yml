# Builds the Windows and Linux releases when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# The tag must match __version__ in src/combat_sim/__init__.py. See docs/releasing.md.
#
# Each platform is tested and built on its own; the release is published only when both
# builds succeed, and then the Docker image (docs/self-hosting.md) is pushed to GitHub's
# registry as ghcr.io/<owner>/<repository>:<version> and :latest. Run it by hand
# (Actions > Release > Run workflow) to build both zips as workflow artifacts and the image
# without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # create the GitHub release

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            # The oldest supported Ubuntu runner: a build runs on Linux systems at least this new (glibc 2.35+)
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4  # The JavaScript tests run inside pytest
        with:
          node-version: '20'

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Name the build
        id: name
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import combat_sim; print(combat_sim.__version__)")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "v$version" != "${{ github.ref_name }}" ]; then
              echo "Tag ${{ github.ref_name }} does not match __version__ $version"; exit 1
            fi
            label="${{ github.ref_name }}"
          else
            label="v$version-test"
          fi
          echo "zip=40kCombatSimulator-$label-${{ matrix.platform }}.zip" >> "$GITHUB_OUTPUT"

      - name: Test
        run: python -m pytest tests -q

      - name: Build
        run: pyinstaller --noconfirm --clean combat_sim.spec

      - name: Zip (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/40kCombatSimulator -DestinationPath "${{ steps.name.outputs.zip }}"

      - name: Zip (Linux)
        if: matrix.platform == 'linux'
        # zip keeps the executable's permissions, which unzip restores
        run: cd dist && zip -qr "../${{ steps.name.outputs.zip }}" 40kCombatSimulator

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ steps.name.outputs.zip }}
          if-no-files-found: error

  docker:
    needs: build  # only after the tests passed on both platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64  # arm64: Raspberry Pi and other small servers
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

  release:
    if: github.ref_type == 'tag'
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only the zips: the Docker step uploads a build record artifact too
          pattern: '{linux,windows}'
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes from docs/release-notes/<tag>.md if written, otherwise generated from the commits
          notes="docs/release-notes/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then
            gh release create "${{ github.ref_name }}" dist/*.zip --title "${{ github.ref_name }}" --notes-file "$notes"
          else
            gh release create "${{ github.ref_name }}" dist/*.zip --title "${{ github.ref_name }}" --generate-notes
          fi
